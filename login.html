<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Codomax Blog</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar"><a class="brand" href="index.html">Codomax Blog</a><nav><a href="index.html">Home</a><a href="register.html">Register</a></nav></header>
<main class="auth-wrapper">
<section class="form-card">
<p class="eyebrow">Welcome Back</p>
<h1>Login</h1>
<form id="loginForm">
<label>Email<input id="loginEmail" type="email" placeholder="you@example.com" required></label>
<label>Password<input id="loginPassword" type="password" placeholder="Enter password" required></label>
<button class="btn full" type="submit">Login</button>
<p id="loginMessage" class="message"></p>
</form>
<p class="center-text">New here? <a href="register.html">Create an account</a></p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
