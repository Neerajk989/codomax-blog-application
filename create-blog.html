<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Blog | Codomax Blog</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar"><a class="brand" href="index.html">Codomax Blog</a><nav><a href="dashboard.html">Dashboard</a><a href="index.html">Home</a></nav></header>
<main class="auth-wrapper">
<section class="form-card wide">
<p class="eyebrow">Write Something New</p>
<h1>Create Blog</h1>
<form id="blogForm">
<label>Blog Title<input id="blogTitle" type="text" placeholder="Enter blog title" required></label>
<label>Category<select id="blogCategory" required><option value="">Choose category</option><option>Technology</option><option>Web Development</option><option>Learning</option><option>Programming</option></select></label>
<label>Content<textarea id="blogContent" rows="10" placeholder="Write your blog..." required></textarea></label>
<button class="btn full" type="submit">Publish Blog</button>
<p id="blogMessage" class="message"></p>
</form>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
