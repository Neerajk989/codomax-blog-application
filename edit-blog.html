<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Blog | Codomax Blog</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar">
<a class="brand" href="index.html">Codomax Blog</a>
<nav><a href="dashboard.html">Dashboard</a><a href="index.html">Home</a></nav>
</header>

<main class="auth-wrapper">
<section class="form-card wide">
<p class="eyebrow">CRUD Operations</p>
<h1>Edit Blog</h1>
<form id="editBlogForm">
<label>Blog Title
<input id="editBlogTitle" type="text" required>
</label>
<label>Category
<select id="editBlogCategory" required>
<option value="">Choose category</option>
<option>Technology</option>
<option>Web Development</option>
<option>Learning</option>
<option>Programming</option>
</select>
</label>
<label>Content
<textarea id="editBlogContent" rows="10" required></textarea>
</label>
<button class="btn full" type="submit">Update Blog</button>
<p id="editBlogMessage" class="message"></p>
</form>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
