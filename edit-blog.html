<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<header class="navbar"><a class="brand" href="index.html">Codomax Blog</a><nav><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a><button id="logoutButton" class="nav-button" type="button">Logout</button></nav></header>
<main class="auth-wrapper"><section class="form-card wide"><p class="eyebrow">Protected Route</p><h1>Edit Blog</h1><p class="form-note">Only the owner of this blog can update it.</p><form id="editBlogForm"><label>Blog Title<input id="editBlogTitle" type="text" required></label><label>Category<select id="editBlogCategory" required><option value="">Choose category</option><option>Technology</option><option>Web Development</option><option>Learning</option><option>Programming</option></select></label><label>Content<textarea id="editBlogContent" rows="10" required></textarea></label><button class="btn full" type="submit">Update Blog</button><p id="editBlogMessage" class="message"></p></form></section></main>
<script src="script.js"></script>
</body>
